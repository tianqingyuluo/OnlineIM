name: onlineim_flutter
description: OnlineIM v1 Flutter 安卓客户端。与 Web / Tauri 共用 HTTP 与 WebSocket 协议。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_webrtc: ^0.12.12
  go_router: ^14.8.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  just_audio: ^0.9.46
  path: ^1.9.1
  permission_handler: ^11.4.0
  record: ^5.2.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
