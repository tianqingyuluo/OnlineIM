services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: online_im
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - onlineim_mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "7000:6379"
    volumes:
      - onlineim_redis_data:/data
    restart: unless-stopped

  mongo:
    image: m.daocloud.io/docker.io/library/mongo:7
    ports:
      - "27017:27017"
    volumes:
      - onlineim_mongo_data:/data/db
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - onlineim_rustfs_data:/data
    restart: unless-stopped

volumes:
  onlineim_mysql_data:
  onlineim_redis_data:
  onlineim_mongo_data:
  onlineim_rustfs_data:
