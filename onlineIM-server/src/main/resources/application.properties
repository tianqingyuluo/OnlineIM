spring.application.name=onlineim

# JWT 签名密钥。HS256 至少 32 字节。
# 下面的值只是本地开发占位，启动时会打警告。生产或多节点请用环境变量 JWT_SECRET 覆盖，且各节点必须相同。
# 未配置或短于 32 字节时应用拒绝启动。
jwt.secret=${JWT_SECRET:dev-only-change-me-jwt-secret-32b!!}

# http server
server.address=0.0.0.0
server.port=8080
frontend.url=http://10.191.187.121:*

# multipart 上限与 nginx client_max_body_size(100m) 对齐：100MB 以内的请求都由业务校验返回明确的 413/415，
# 避免框架在读取中途拒绝请求导致反向代理等待超时
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# 聊天图片/文件上传限制（ChatUploadProperties），超过 im.upload.*-max-size 返回 413，类型不允许返回 415
im.upload.image-max-size=10MB
im.upload.file-max-size=20MB
im.upload.image-formats=jpeg,png,gif,bmp
im.upload.thumbnail-max-edge=320

# database account and password from outside file
spring.config.import=db.properties

### MySQL ###
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/online_im
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

### Netty WebSocket ###
websocket.port=8081
websocket.path=/api/v1/chat
node.ip=localhost:8081
# 心跳间隔（客户端发送间隔，服务端清理间隔）
websocket.heartbeat.interval=30s
# 心跳超时阈值（超过此时间无任何入站帧则判定为死连接）
websocket.heartbeat.timeout=90s

### MyBatis ###
mybatis.mapper-locations=classpath*:mapper/*.xml

### Redis ###
spring.data.redis.host=127.0.0.1
spring.data.redis.port=7000
spring.data.redis.database=0
spring.data.redis.password=
spring.data.redis.timeout=2000

### MongoDB ###
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/online_im

### OSS ###
# OSS???rustfs, minio, s3, aliyun, tencent
oss.type=rustfs
# ????URL
oss.endpoint=http://localhost:9000
# ???S3????COS???
#oss.region=us-east-1
# ????
oss.access-key=rustfsadmin
# ????
oss.secret-key=rustfsadmin
# CDN??????
#oss.cdn-domain=
# ???????
oss.default-bucket=onlineim
# 返回给客户端的文件 URL 前缀（RustFS/MinIO），文件经后端 /{bucket}/... 代理读取。
# 本地开发前后端分端口时用后端地址；放在反向代理后面时可设为空串，返回 /onlineim/... 相对路径。
oss.public-base-url=http://localhost:8080

# 消息撤回时间窗（秒）：只能撤回发送后该时间内的消息，REST 与 WebSocket 撤回共用；小于等于 0 表示不限制
im.message.recall-window-seconds=120
